# React Native/Metro necesitan node_modules planos (1.1). pnpm 12 ya no lee esto de .npmrc.
nodeLinker: hoisted

packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - globals@17.13.0
  - turbo@2.11.6
  - vite@8.3.2

# Versiones compartidas. React lo fija Expo SDK 57: el admin usa la misma para que
# solo exista una copia de React en el node_modules plano.
catalog:
  react: 19.2.3
  react-dom: 19.2.3
  '@types/react': ~19.2.18
  '@types/react-dom': ~19.2.0
  zod: ^4.6.5
  typescript: ~6.0.3
  vitest: ^5.0.3

# Una sola copia de React en todo el monorepo (la CLI de Prisma trae otra como peer de Prisma Studio).
overrides:
  react: 'catalog:'
  react-dom: 'catalog:'
  # Dependencias de la CLI de Prisma con avisos de seguridad (pnpm audit, 7.8).
  mysql2: ^3.23.1
  deepmerge-ts: ^8.0.0

# Excepciones de `pnpm audit` (pre-push, 7.8). Cada una con motivo y fecha de revisión.
auditConfig:
  ignoreGhsas:
    # node-forge (vía @expo/cli): verificación de firmas RSA PKCS#1. Solo se usa en la CLI de
    # Expo en el PC del desarrollador (code signing de updates, que no usamos); no llega al APK
    # ni al servidor. Sin versión corregida a 2026-10-02. Revisar al actualizar Expo.
    - GHSA-86w9-cpqp-85rv
